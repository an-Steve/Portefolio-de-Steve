<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeu du nombre mystère (JS)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      width: min(92vw, 600px);
      margin: 40px auto;
      padding: 0 1rem;
    }
    .box {
      border: 1px solid #ddd;
      padding: clamp(1rem, 3vw, 1.5rem);
      border-radius: 12px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-top: 1rem;
    }
    input {
      padding: 0.8rem 0.9rem;
      width: min(100%, 220px);
      min-height: 44px;
      font-size: 1rem;
    }
    button {
      padding: 0.8rem 1rem;
      min-height: 44px;
      font-size: 1rem;
    }
    .msg { margin-top: 12px; font-weight: 600; }

    @media (max-width: 480px) {
      body {
        margin: 24px auto;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      input, button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>Jeu du nombre mystère 🎮</h1>
  <div class="box">
    <p>Devine le nombre entre 1 et 100.</p>
    <div class="controls">
      <input id="entree" type="number" min="1" max="100" placeholder="Ton essai" />
      <button id="btn">Vérifier</button>
    </div>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    let secret = Math.floor(Math.random() * 100) + 1;
    let essais = 0;

    document.getElementById("btn").addEventListener("click", () => {
      const msg = document.getElementById("msg");
      const val = parseInt(document.getElementById("entree").value, 10);

      if (Number.isNaN(val)) { msg.textContent = "Entre un nombre valide."; return; }
      essais++;
      if (val < secret) msg.textContent = "C'est plus grand !";
      else if (val > secret) msg.textContent = "C'est plus petit !";
      else {
        msg.textContent = `Bravo 🎉 trouvé en ${essais} essais !`;
        secret = Math.floor(Math.random() * 100) + 1; // rejouer
        essais = 0;
      }
    });
  </script>
</body>
</html>
